[project]
name = "transforming-non-stationary-time-series-with-differencing"
version = "0.1.0"
description = "Companion code for Medium article: transforming non stationary time series with differencing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
